<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇬🇧 Irregular Verbs Learning 🇬🇧</title>
    <style>
        :root {
            --primary: #2980b9;    /* Bleu pour Cours */
            --secondary: #f39c12;  /* Jaune/Orange pour Exercice */
            --eval: #8e44ad;       /* Violet pour Évaluation */
            --success: #27ae60; 
            --error: #c0392b; 
            --bg: #f0f2f5;
            --dark: #34495e;
        }

        /* Protection : empêche la sélection de texte */
        * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        input { -webkit-user-select: text; user-select: text; }

        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
        }

        .container { 
            display: flex; flex-direction: column; height: 100vh; 
            max-width: 1200px; margin: auto; background: white; 
            padding: 15px 25px; box-sizing: border-box; position: relative;
        }
        
        h1 { color: var(--dark); text-align: center; margin: 0 0 10px 0; font-size: 1.8rem; }
        .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        
        button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; color: white; transition: 0.2s; }
        .btn-cours { background: var(--primary); }
        .btn-exo { background: var(--secondary); }
        .btn-eval { background: var(--eval); }
        button:hover { opacity: 0.9; transform: scale(1.02); }

        /* Style de la barre d'outils adaptable */
        .toolbar-inline { 
            display: flex; align-items: center; justify-content: space-between; 
            gap: 15px; padding: 8px 20px; border-radius: 8px; color: white; 
            margin-bottom: 10px; flex-shrink: 0; font-weight: bold;
        }

        /* Couleurs spécifiques par section pour la cohérence */
        .toolbar-exo { background: var(--secondary); color: #fff; }
        .toolbar-eval { background: var(--eval); justify-content: center; }

        .toolbar-group { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .toolbar-inline select { padding: 4px; border-radius: 4px; border: none; outline: none; }
        .score-pill { background: rgba(0,0,0,0.15); padding: 4px 12px; border-radius: 20px; min-width: 90px; text-align: center; }

        .search-bar { 
            width: 100%; padding: 10px; margin-bottom: 10px; 
            border: 2px solid var(--primary); border-radius: 6px; 
            box-sizing: border-box; flex-shrink: 0; 
        }

        .table-container { 
            flex-grow: 1; overflow-y: auto; border: 1px solid #ddd; 
            border-radius: 8px; background: #fff;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { color: white; padding: 12px; position: sticky; top: -1px; z-index: 10; font-size: 0.9rem; }
        
        /* En-têtes de colonnes colorés selon la section */
        .th-cours { background: var(--primary); }
        .th-exo { background: var(--secondary); }
        .th-eval { background: var(--eval); }

        td { border-bottom: 1px solid #eee; padding: 8px; text-align: center; font-size: 0.9rem; }

        .footer-copyright {
            text-align: center; font-size: 0.75rem; color: #7f8c8d; margin-top: 5px; flex-shrink: 0; font-weight: bold;
        }

        .hidden { display: none !important; }
        #section-cours, #section-exercice, #section-evaluation {
            display: flex; flex-direction: column; height: 100%; overflow: hidden;
        }
        
        input { padding: 6px; border: 2px solid #bdc3c7; border-radius: 4px; text-align: center; width: 95%; box-sizing: border-box; }
        .input-double { width: 46%; margin: 1px; }
        .correct { border-color: var(--success) !important; background-color: #eafaf1; color: var(--success); font-weight: bold; }
        .wrong { border-color: var(--error) !important; background-color: #fdf2f2; color: var(--error); }
        
        .eval-wrong-text { color: var(--error); text-decoration: line-through; font-size: 0.8em; margin-right: 5px; }
        .eval-correct-text { color: var(--success); font-weight: bold; font-size: 0.85em; }
        .eval-perfect { color: var(--success); font-weight: bold; }
        .result-final { font-size: 1.8rem; margin-bottom: 10px; font-weight: bold; color: var(--eval); text-align: center; flex-shrink: 0; }
        .col-fr { background: #fcfcfc; border-left: 1px solid #eee; font-style: italic; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h1>🇬🇧 Irregular Verbs Learning 🇬🇧</h1>
    
    <div class="nav">
        <button class="btn-cours" onclick="showSection('cours')">📖 Cours</button>
        <button class="btn-exo" onclick="showSection('exercice')">✍️ Exercices</button>
        <button class="btn-eval" onclick="showSection('evaluation')">🎓 Évaluation</button>
    </div>

    <div id="section-cours">
        <input type="text" id="search" class="search-bar" placeholder="🔍 Chercher un verbe (infinitif ou français)..." onkeyup="searchVerb()">
        <div class="table-container">
            <table>
                <thead><tr><th class="th-cours">Infinitif</th><th class="th-cours">Prétérit</th><th class="th-cours">Participe Passé</th><th class="th-cours">Français</th></tr></thead>
                <tbody id="table-body-cours"></tbody>
            </table>
        </div>
    </div>

    <div id="section-exercice" class="hidden">
        <div class="toolbar-inline toolbar-exo">
            <div class="score-pill" id="score-display">Score : 0 / 0</div>
            <div class="toolbar-group">
                <label>Série :</label>
                <select id="series-select" onchange="generateExercise()">
                    <option value="0-20">Verbes 1 à 20</option>
                    <option value="20-40">Verbes 21 à 40</option>
                    <option value="40-60">Verbes 41 à 60</option>
                    <option value="60-80">Verbes 61 à 80</option>
                    <option value="random">20 au hasard</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Difficulté :</label>
                <select id="difficulty-select" onchange="generateExercise()">
                    <option value="1">1 case vide</option>
                    <option value="2">2 cases vides</option>
                    <option value="3">Tout vide</option>
                </select>
            </div>
            <button class="btn-cours" style="background: rgba(0,0,0,0.2); padding: 5px 12px; font-size: 0.8rem;" onclick="generateExercise()">🔄 Relancer</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th class="th-exo">Infinitif</th><th class="th-exo">Prétérit</th><th class="th-exo">Participe Passé</th><th class="th-exo">Français</th></tr></thead>
                <tbody id="table-body-exercice"></tbody>
            </table>
        </div>
    </div>

    <div id="section-evaluation" class="hidden">
        <div id="final-result-area" class="result-final hidden"></div>
        <div class="toolbar-inline toolbar-eval">
            <span>🎓 ÉVALUATION FINALE (20 verbes)</span>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th class="th-eval">Infinitif</th><th class="th-eval">Prétérit</th><th class="th-eval">Participe Passé</th><th class="th-eval">Français</th></tr>
                </thead>
                <tbody id="table-body-evaluation"></tbody>
            </table>
        </div>
        <div style="margin-top:10px; text-align:center; flex-shrink: 0;">
            <button id="btn-submit-eval" class="btn-eval" onclick="validateEvaluation()">✅ Valider mes réponses</button>
            <button class="btn-cours" onclick="showSection('evaluation')">🔄 Recommencer</button>
        </div>
    </div>

    <div class="footer-copyright">
        © 2026 - Corentin BLERVACQUE - Tous droits réservés
    </div>
</div>

<script>
    // Sécurité clavier
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    const verbs = [
        {inf:"be", pret:"was/were", pp:"been", fr:"être"},
        {inf:"become", pret:"became", pp:"become", fr:"devenir"},
        {inf:"begin", pret:"began", pp:"begun", fr:"commencer"},
        {inf:"break", pret:"broke", pp:"broken", fr:"casser"},
        {inf:"bring", pret:"brought", pp:"brought", fr:"apporter"},
        {inf:"build", pret:"built", pp:"built", fr:"construire"},
        {inf:"buy", pret:"bought", pp:"bought", fr:"acheter"},
        {inf:"can", pret:"could", pp:"been able", fr:"pouvoir"},
        {inf:"catch", pret:"caught", pp:"caught", fr:"attraper"},
        {inf:"choose", pret:"chose", pp:"chosen", fr:"choisir"},
        {inf:"come", pret:"came", pp:"come", fr:"venir"},
        {inf:"cost", pret:"cost", pp:"cost", fr:"coûter"},
        {inf:"cut", pret:"cut", pp:"cut", fr:"couper"},
        {inf:"do", pret:"did", pp:"done", fr:"faire"},
        {inf:"draw", pret:"drew", pp:"drawn", fr:"dessiner"},
        {inf:"drink", pret:"drank", pp:"drunk", fr:"boire"},
        {inf:"drive", pret:"drove", pp:"driven", fr:"conduire"},
        {inf:"eat", pret:"ate", pp:"eaten", fr:"manger"},
        {inf:"fall", pret:"fell", pp:"fallen", fr:"tomber"},
        {inf:"feel", pret:"felt", pp:"felt", fr:"ressentir"},
        {inf:"fight", pret:"fought", pp:"fought", fr:"se battre"},
        {inf:"find", pret:"found", pp:"found", fr:"trouver"},
        {inf:"fly", pret:"flew", pp:"flown", fr:"voler"},
        {inf:"forget", pret:"forgot", pp:"forgotten", fr:"oublier"},
        {inf:"get", pret:"got", pp:"got", fr:"obtenir"},
        {inf:"give", pret:"gave", pp:"given", fr:"donner"},
        {inf:"go", pret:"went", pp:"gone", fr:"aller"},
        {inf:"grow", pret:"grew", pp:"grown", fr:"grandir"},
        {inf:"have", pret:"had", pp:"had", fr:"avoir"},
        {inf:"hear", pret:"heard", pp:"heard", fr:"entendre"},
        {inf:"hide", pret:"hid", pp:"hidden", fr:"cacher"},
        {inf:"hit", pret:"hit", pp:"hit", fr:"frapper"},
        {inf:"hold", pret:"held", pp:"held", fr:"tenir"},
        {inf:"hurt", pret:"hurt", pp:"hurt", fr:"blesser"},
        {inf:"keep", pret:"kept", pp:"kept", fr:"garder"},
        {inf:"know", pret:"knew", pp:"known", fr:"savoir"},
        {inf:"learn", pret:"learnt", pp:"learnt", fr:"apprendre"},
        {inf:"leave", pret:"left", pp:"left", fr:"quitter"},
        {inf:"lend", pret:"lent", pp:"lent", fr:"prêter"},
        {inf:"let", pret:"let", pp:"let", fr:"laisser"},
        {inf:"lose", pret:"lost", pp:"lost", fr:"perdre"},
        {inf:"make", pret:"made", pp:"made", fr:"faire / fabriquer"},
        {inf:"mean", pret:"meant", pp:"meant", fr:"signifier"},
        {inf:"meet", pret:"met", pp:"met", fr:"rencontrer"},
        {inf:"pay", pret:"paid", pp:"paid", fr:"payer"},
        {inf:"put", pret:"put", pp:"put", fr:"mettre"},
        {inf:"read", pret:"read", pp:"read", fr:"lire"},
        {inf:"ride", pret:"rode", pp:"ridden", fr:"monter (vélo/cheval)"},
        {inf:"ring", pret:"rang", pp:"rung", fr:"sonner"},
        {inf:"run", pret:"ran", pp:"run", fr:"courir"},
        {inf:"say", pret:"said", pp:"said", fr:"dire"},
        {inf:"see", pret:"saw", pp:"seen", fr:"voir"},
        {inf:"sell", pret:"sold", pp:"sold", fr:"vendre"},
        {inf:"send", pret:"sent", pp:"sent", fr:"envoyer"},
        {inf:"show", pret:"showed", pp:"shown", fr:"montrer"},
        {inf:"shut", pret:"shut", pp:"shut", fr:"fermer"},
        {inf:"sing", pret:"sang", pp:"sung", fr:"chanter"},
        {inf:"sit", pret:"sat", pp:"sat", fr:"s'asseoir"},
        {inf:"sleep", pret:"slept", pp:"slept", fr:"dormir"},
        {inf:"smell", pret:"smelt", pp:"smelt", fr:"sentir"},
        {inf:"speak", pret:"spoke", pp:"spoken", fr:"parler"},
        {inf:"spell", pret:"spelt", pp:"spelt", fr:"épeler"},
        {inf:"spend", pret:"spent", pp:"spent", fr:"dépenser"},
        {inf:"stand", pret:"stood", pp:"stood", fr:"être debout"},
        {inf:"steal", pret:"stole", pp:"stolen", fr:"voler"},
        {inf:"swim", pret:"swam", pp:"swum", fr:"nager"},
        {inf:"take", pret:"took", pp:"taken", fr:"prendre"},
        {inf:"teach", pret:"taught", pp:"taught", fr:"enseigner"},
        {inf:"tell", pret:"told", pp:"told", fr:"raconter / dire"},
        {inf:"think", pret:"thought", pp:"thought", fr:"penser"},
        {inf:"throw", pret:"threw", pp:"thrown", fr:"jeter"},
        {inf:"understand", pret:"understood", pp:"understood", fr:"comprendre"},
        {inf:"wake", pret:"woke", pp:"woken", fr:"se réveiller"},
        {inf:"wear", pret:"wore", pp:"worn", fr:"porter"},
        {inf:"win", pret:"won", pp:"won", fr:"gagner"},
        {inf:"write", pret:"wrote", pp:"written", fr:"écrire"}
    ];

    let currentPoints = 0, totalPoints = 0;

    function showSection(id) {
        document.querySelectorAll('.container > div[id]').forEach(d => d.classList.add('hidden'));
        document.getElementById('section-' + id).classList.remove('hidden');
        if(id === 'exercice') generateExercise();
        if(id === 'evaluation') startEvaluation();
    }

    function initCours() {
        document.getElementById('table-body-cours').innerHTML = verbs.map(v => 
            `<tr><td><strong>${v.inf}</strong></td><td>${v.pret}</td><td>${v.pp}</td><td class="col-fr">${v.fr}</td></tr>`
        ).join('');
    }

    function searchVerb() {
        const query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('#table-body-cours tr').forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
        });
    }

    function generateExercise() {
        const range = document.getElementById('series-select').value;
        const diff = parseInt(document.getElementById('difficulty-select').value);
        let selected = (range === 'random') ? [...verbs].sort(() => 0.5 - Math.random()).slice(0, 20) : verbs.slice(...range.split('-').map(Number));
        const body = document.getElementById('table-body-exercice');
        body.innerHTML = ""; totalPoints = 0; currentPoints = 0;
        selected.forEach(v => {
            const row = document.createElement('tr');
            let indices = [0,1,2,3].sort(() => 0.5 - Math.random()).slice(0, diff);
            let cols = [v.inf, v.pret, v.pp, v.fr];
            cols.forEach((val, i) => {
                const td = document.createElement('td');
                if(i === 3) td.className = "col-fr";
                if(indices.includes(i)) {
                    if(val.includes('/')) {
                        const p = val.split('/'); totalPoints += 2;
                        td.innerHTML = `<input type="text" class="input-double" oninput="checkExo(this, '${p[0].trim()}')"><input type="text" class="input-double" oninput="checkExo(this, '${p[1].trim()}')">`;
                    } else {
                        totalPoints++; td.innerHTML = `<input type="text" oninput="checkExo(this, '${val}')">`;
                    }
                } else { td.innerHTML = `<strong>${val}</strong>`; }
                row.appendChild(td);
            });
            body.appendChild(row);
        });
        updateScore();
    }

    function checkExo(input, answer) {
        const val = input.value.trim().toLowerCase();
        if(val === "") { if(input.classList.contains('correct')) currentPoints--; input.className = input.classList.contains('input-double') ? "input-double" : ""; }
        else if(val === answer.toLowerCase()) { if(!input.classList.contains('correct')) currentPoints++; input.className = (input.classList.contains('input-double') ? "input-double " : "") + "correct"; }
        else { if(input.classList.contains('correct')) currentPoints--; input.className = (input.classList.contains('input-double') ? "input-double " : "") + "wrong"; }
        updateScore();
    }

    function updateScore() { document.getElementById('score-display').innerText = `Score : ${currentPoints} / ${totalPoints}`; }

    function startEvaluation() {
        const body = document.getElementById('table-body-evaluation');
        document.getElementById('final-result-area').classList.add('hidden');
        document.getElementById('btn-submit-eval').classList.remove('hidden');
        body.innerHTML = "";
        let selected = [...verbs].sort(() => 0.5 - Math.random()).slice(0, 20);
        selected.forEach(v => {
            const row = document.createElement('tr');
            let indices = [0,1,2,3].sort(() => 0.5 - Math.random()).slice(0, 2);
            let cols = [v.inf, v.pret, v.pp, v.fr];
            cols.forEach((val, i) => {
                const td = document.createElement('td');
                if(i === 3) td.className = "col-fr";
                if(indices.includes(i)) {
                    if(val.includes('/')) {
                        const p = val.split('/');
                        td.innerHTML = `<input type="text" class="input-double" data-ans="${p[0].trim()}"><input type="text" class="input-double" data-ans="${p[1].trim()}">`;
                    } else { td.innerHTML = `<input type="text" data-ans="${val}">`; }
                } else { td.innerHTML = `<strong>${val}</strong>`; }
                row.appendChild(td);
            });
            body.appendChild(row);
        });
    }

    function validateEvaluation() {
        const inputs = document.querySelectorAll('#table-body-evaluation input');
        let correctCount = 0;
        inputs.forEach(input => {
            const userVal = input.value.trim().toLowerCase();
            const correctVal = input.getAttribute('data-ans').toLowerCase();
            if(userVal === correctVal) {
                correctCount++; const span = document.createElement('span');
                span.className = "eval-perfect"; span.innerText = userVal; input.replaceWith(span);
            } else {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `<span class="eval-wrong-text">${userVal || '(vide)'}</span><span class="eval-correct-text">${correctVal}</span>`;
                input.replaceWith(wrapper);
            }
        });
        const note = (correctCount / inputs.length) * 20;
        const resArea = document.getElementById('final-result-area');
        resArea.innerHTML = `Note : ${note.toFixed(1)} / 20 🎯`;
        resArea.classList.remove('hidden');
        document.getElementById('btn-submit-eval').classList.add('hidden');
    }

    initCours();
    showSection('cours');
</script>
</body>
</html>
